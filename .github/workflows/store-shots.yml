name: Store screenshots (33 languages, phone + tablet + feature graphic)

# Gerçek oyun ekranlarından mağaza görselleri üretir; elle başlatılır.
# Sonuç: "store" sürümüne store-graphics.zip olarak yüklenir.
on:
  workflow_dispatch:
    inputs:
      langs:
        description: "Virgülle diller (boş = 33 dilin hepsi)"
        required: false
        default: ""

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_7, pixel_tablet]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install pillow==11.0.0
          python tool/generate_assets.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          flutter create --platforms=android,ios,web --org com.gamestudio100 --project-name merkez_kart_oyunlari .
          python tool/patch_platforms.py
          flutter pub get
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create
      - name: Build debug APK (warm cache)
        run: flutter build apk --debug || (sleep 60 && flutter build apk --debug)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture on emulator (${{ matrix.profile }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/store_shots_test.dart --dart-define=LANGS=${{ github.event.inputs.langs }} -d emulator-5554
      - run: python tool/crop_store.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-shots-${{ matrix.profile }}
          path: shots/store/
          retention-days: 30

  publish:
    needs: shots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: store-shots-*
          path: all
          merge-multiple: true
      - run: |
          cd all && zip -qr ../store-graphics.zip . && cd ..
          ls -la store-graphics.zip
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view store -R ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create store -R ${{ github.repository }} --title "Mağaza görselleri" --notes "33 dilde telefon/tablet ekran görüntüleri ve öne çıkan görsel." --prerelease
          gh release upload store store-graphics.zip -R ${{ github.repository }} --clobber
